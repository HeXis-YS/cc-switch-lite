[package]
name = "cc-switch-lite"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
toml = "0.8"
glob-match = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

flate2 = "1"
brotli = "7"
zstd = "0.13"
chrono = "0.4"
http = "1"

[dev-dependencies]
tempfile = "3"
