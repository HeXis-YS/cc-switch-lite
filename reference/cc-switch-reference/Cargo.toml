[package]
name = "cc-switch-reference"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
test = false
doctest = false

[dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
http = "1"
axum = "0.7"
